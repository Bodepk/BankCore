name: CI

# Corre en cada push y en cada Pull Request hacia main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build y tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Cachea las dependencias de Gradle entre corridas para que sea más rápido
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar y correr tests
        run: ./gradlew clean test --no-daemon

      # Si algo falla, subimos el reporte de tests como artefacto
      # descargable desde la pestaña "Actions" de GitHub, para poder
      # revisarlo sin tener que reproducir el fallo localmente.
      - name: Subir reporte de tests (si falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7